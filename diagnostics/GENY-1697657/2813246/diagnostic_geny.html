* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Delight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #F0F2F4;
  color: #202124;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.card {
  width: 100%;
  max-width: 640px;
  background: #FFFFFF;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15), 0 8px 24px rgba(60, 64, 67, 0.15);
}
.card-header {
  background: linear-gradient(90deg, #0f534f, #14907d);
  padding: 24px 32px;
}
.logo { width: 116px; height: 46px; display: block; }
.card-body { padding: 40px 32px; background: #FFFFFF; }
.code {
  font-family: 'ChangaOne', 'Arial Black', sans-serif;
  font-size: 72px;
  line-height: 1;
  background: linear-gradient(90deg, #0f534f, #14907d);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #006458;
  margin-bottom: 8px;
}
h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
.message { font-size: 16px; line-height: 1.5; color: #505558; margin-bottom: 32px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  display: inline-block;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  line-height: 1;
  padding: 14px 24px;
  border-radius: 8px;
  text-decoration: none;
  cursor: pointer;
  border: 2px solid #006458;
}
.btn-primary { background: #006458; color: #FFFFFF; }
.btn-primary:hover { background: #005349; border-color: #005349; }
.btn-outline { background: #FFFFFF; color: #006458; }
.btn-outline:hover { background: #F2FBFA; }
.card-footer {
  border-top: 1px solid #c5d7d9;
  background: #F2FBFA;
  color: #006458;
  padding: 16px 32px;
  font-size: 14px;
}
@media (max-width: 480px) {
  .card-header { padding: 20px 24px; }
  .card-body { padding: 32px 24px; }
  .card-footer { padding: 16px 24px; }
  .code { font-size: 56px; }
  h1 { font-size: 20px; }
}
</style>
