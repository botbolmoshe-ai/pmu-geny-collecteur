name: PMU - Test isole rapprochement (sans production)
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date AAAA-MM-JJ'
        required: true
        default: '2026-11-12'
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Charger uniquement la branche de test
        uses: actions/checkout@v4
        with:
          ref: test/rapprochement-2026-11-12
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Executer le test en lecture seule (aucun secret, aucun acces production)
        run: python -m pmu_geny.test_rapprochement_date --date "${{ inputs.date }}" --output resultats/rapprochement.json
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapprochement-test-${{ github.run_id }}
          path: resultats/rapprochement.json
          if-no-files-found: warn
