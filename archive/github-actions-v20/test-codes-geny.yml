name: PMU - Verification hors ligne codes Geny D R
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  valider:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/rapprochement-2026-11-12
          persist-credentials: false
      - name: Recuperer les historiques deja collectes
        uses: actions/download-artifact@v4
        with:
          name: pmu-test-suite-historique-43006086330
          run-id: 43006086330
          repository: botbolmoshe-ai/pmu-geny-collecteur
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archives_test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer la dependance Python requise (sans navigateur)
        run: python -m pip install playwright
      - name: Verifier les 2 codes sans acces web
        run: python -m pmu_geny.test_codes_geny
      - name: Archiver le resultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-codes-geny-${{ github.run_id }}
          path: resultats/validation_codes_geny.json
          if-no-files-found: warn
