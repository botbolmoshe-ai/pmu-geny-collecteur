name: PMU - Diagnostic Geny une fiche historique (isole)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Charger le code de test uniquement
        uses: actions/checkout@v4
        with:
          ref: test/rapprochement-2026-11-12
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tester une seule fiche historique sans decouverte
        run: python -m pmu_geny.test_fiche_historique_unique --cheval-id 2788633
      - name: Conserver rapport et preuve de reponse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-fiche-geny-${{ github.run_id }}
          path: resultats/test_fiche_historique/
          if-no-files-found: warn
