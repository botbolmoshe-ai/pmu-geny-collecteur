name: PMU - Test isole historique 2 chevaux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/rapprochement-2026-11-12
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer dependances et navigateur
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tester R1C1 Vincennes, maximum deux historiques
        run: python -m pmu_geny.test_historique_isole --date 2026-11-12 --course R1C1 --max-chevaux 2
      - name: Publier les diagnostics et les historiques du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmu-test-historique-${{ github.run_id }}
          path: resultats/test_historique/
          if-no-files-found: warn
