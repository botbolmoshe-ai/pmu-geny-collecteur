name: PMU - Controle Frank Gio et 4 historiques (test)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Charger le code de la branche de test
        uses: actions/checkout@v4
        with:
          ref: test/rapprochement-2026-11-12
          persist-credentials: false
      - name: Recuperer les liens attestes de 17 chevaux
        uses: actions/download-artifact@v4
        with:
          name: pmu-test-historique-43001015559
          run-id: 43001015559
          repository: botbolmoshe-ai/pmu-geny-collecteur
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: precedent
      - name: Recuperer les donnees historiques de Frank Gio
        uses: actions/download-artifact@v4
        with:
          name: pmu-historiques-progressifs-43005276601
          run-id: 43005276601
          repository: botbolmoshe-ai/pmu-geny-collecteur
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: historique_precedent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer navigateur et dependances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Valider la correction Frank Gio puis collecter 4 historiques
        run: python -m pmu_geny.test_suite_historique --pause-secondes 30
      - name: Conserver fichiers et diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmu-test-suite-historique-${{ github.run_id }}
          path: resultats/test_suite/
          if-no-files-found: warn
