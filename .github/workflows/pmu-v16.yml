name: PMU - V20.3 Diagnostic decouverte et orchestration

on:
  schedule:
    # Chaque quart d'heure; gate Europe/Paris dans Python (été/hiver).
    - cron: '0,15,30,45 5-20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Decouvrir une seule fois, puis Collecter sans nouvelle decouverte'
        type: choice
        required: true
        default: 'auto'
        options: ['auto', 'decouvrir', 'collecter', 'controle_np', 'consolider']
      course_url:
        description: 'URL officielle Geny /course/ID.../partants-pronostics'
        type: string
        required: true
        default: 'https://www.geny.com/course/1697377-2026-11-10-vincennes-prix-de-beauvais/partants-pronostics'
      nombre_partants:
        description: 'Nombre de lignes attendues (declarations, non-partants inclus)'
        type: number
        required: true
        default: 18
      pmu_url:
        description: 'URL de la fiche officielle PMU consultee (mode controle_np)'
        type: string
        required: false
        default: ''
      np_numeros:
        description: 'Numeros NP releves sur PMU, separes par virgules; vide si 0 NP'
        type: string
        required: false
        default: ''
      pmu_liste_complete:
        description: 'Confirmer que la liste complete sur PMU a ete examinee'
        type: boolean
        required: false
        default: false
      max_chevaux:
        description: 'Maximum de nouvelles fiches a consulter pour cette execution'
        type: number
        required: true
        default: 18

permissions:
  contents: write

concurrency:
  group: pmu-donnees-production
  cancel-in-progress: false

jobs:
  traiter-course:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Valider les parametres et restaurer les donnees durables
        env:
          COURSE_URL: ${{ inputs.course_url || 'https://www.geny.com/course/1697377-2026-11-10-vincennes-prix-de-beauvais/partants-pronostics' }}
          NOMBRE: ${{ inputs.nombre_partants || 18 }}
          MAX: ${{ inputs.max_chevaux || 18 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache_pmu resultats
          python - <<'PYVALID'
          import os, re
          from urllib.parse import urlparse
          url=os.environ['COURSE_URL']
          parsed=urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname in ('www.geny.com','geny.com'), 'URL externe non autorisee'
          m=re.match(r'^/course/(\d+)(?:-[^/]*)?(?:/partants-pronostics)?/?$',parsed.path)
          assert m, 'URL de course Geny invalide'
          assert 1 <= int(os.environ['NOMBRE']) <= 30
          assert 1 <= int(os.environ['MAX']) <= 30
          with open('course_id.txt','w') as f:f.write(m.group(1))
          print('COURSE ID',m.group(1))
          PYVALID
          if git ls-remote --exit-code --heads origin pmu-data >/dev/null 2>&1; then
            git fetch --no-tags origin pmu-data
            git archive origin/pmu-data | tar -x -C cache_pmu
            echo 'DONNEES PERSISTANTES : rechargees depuis pmu-data'
          else
            echo 'DONNEES PERSISTANTES : branche pmu-data absente, initialisation'
          fi
      - name: Installer Playwright (decouverte ou collecte uniquement)
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'auto' || inputs.mode == 'decouvrir' || inputs.mode == 'collecter') || github.event.schedule == '0,15,30,45 5-20 * * *'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MINUTE=$(TZ=Europe/Paris date +%M)
            if [ "$MINUTE" -ge 15 ]; then
              echo 'Cycle leger : navigateur Geny non requis.'
              exit 0
            fi
          fi
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Installer les dependances ML (cycles legers inclus)
        run: python -m pip install -q scikit-learn==1.7.2 joblib==1.5.2
      - name: Cycle automatique quotidien (PMU puis Geny, sans doublons)
        if: github.event_name == 'schedule' || inputs.mode == 'auto'
        shell: bash
        env:
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          python - <<'PYRUN'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          from pmu_geny.auto_v18 import run
          from pathlib import Path
          now=datetime.now(ZoneInfo('Europe/Paris'))
          # Une seule plage 07:00-21:59 Paris: pas d'activité de nuit.
          if not 7 <= now.hour <= 21:
              print('En dehors du créneau 07:00–21:59 Europe/Paris')
          else:
              full=(now.minute < 15)
              root=Path('cache_pmu')
              today=now.date().isoformat()
              today_state=run(root,today,[],3 if full else 0,
                  max_discoveries=1 if full else 0,now=now)
              # J-1 dès 18 h : partage du quota global Geny (3 fiches/h).
              # La priorité est donnée au jour J ; reliquat pour le lendemain.
              if full and now.hour>=18:
                  remaining=max(0,3-today_state.get('fiches_geny_budget_consommees',0))
                  tomorrow=(now+timedelta(days=1)).date().isoformat()
                  run(root,tomorrow,[],remaining,max_discoveries=1,now=now)
              print('Cycle complet' if full else 'Cycle PMU de proximité')
          PYRUN
      - name: Decouvrir les partants, sans collecter les historiques
        if: inputs.mode == 'decouvrir'
        env:
          COURSE_URL: ${{ inputs.course_url || 'https://www.geny.com/course/1697377-2026-11-10-vincennes-prix-de-beauvais/partants-pronostics' }}
          NOMBRE: ${{ inputs.nombre_partants || 18 }}
        shell: bash
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          # Un manifeste valide est reutilise : zero requete reseau.
          if [ -s "cache_pmu/manifestes/GENY-${CID}.json" ]; then
            echo "MANIFESTE EXISTANT : pas de nouvelle decouverte pour ${CID}"
          else
            # Ne pas redemander une page des partants pendant le cooldown partage.
            python - <<'PYCOOLDOWN'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          statefile=Path('cache_pmu/etat_persistant.json')
          if statefile.exists():
              state=json.loads(statefile.read_text(encoding='utf-8'))
              t=(state.get('dernier_blocage_geny') or {}).get('utc')
              if t and datetime.now(timezone.utc) < datetime.fromisoformat(t)+timedelta(hours=1):
                  raise SystemExit('COOLDOWN GENY : decouverte differee sans nouvelle requete.')
          PYCOOLDOWN
            python -m pmu_geny.decouverte_partants \
              --course-url "$COURSE_URL" \
              --attendu "$NOMBRE" \
              --manifest "cache_pmu/manifestes/GENY-${CID}.json" \
              --diagnostic "resultats/decouverte-${CID}" \
              --etat cache_pmu/etat_persistant.json
          fi
      - name: Collecter depuis le manifeste stocke, sans decouverte
        if: inputs.mode == 'collecter'
        env:
          MAX: ${{ inputs.max_chevaux || 18 }}
        shell: bash
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          MANIFEST="cache_pmu/manifestes/GENY-${CID}.json"
          if [ ! -s "$MANIFEST" ]; then
            echo "ERREUR : aucun manifeste pour GENY-${CID}. Lancer d'abord le mode decouvrir." >&2
            exit 2
          fi
          python -m pmu_geny.traitement_course \
            --manifest "$MANIFEST" \
            --sortie resultats \
            --etat cache_pmu/etat_persistant.json \
            --max-chevaux "$MAX" \
            --cooldown-heures 1
      - name: Verifier les non-partants d'apres une consultation confirmee de PMU
        if: inputs.mode == 'controle_np'
        shell: bash
        env:
          PMU_URL: ${{ inputs.pmu_url }}
          NP_NUMEROS: ${{ inputs.np_numeros }}
          PMU_LISTE_COMPLETE: ${{ inputs.pmu_liste_complete }}
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          MANIFEST="cache_pmu/manifestes/GENY-${CID}.json"
          if [ ! -s "$MANIFEST" ]; then echo 'Manifeste absent : lancer decouvrir.' >&2; exit 2; fi
          if [ "$PMU_LISTE_COMPLETE" != 'true' ]; then
            echo 'Pour valider 0 NP et tous les partants, confirmer la consultation de la liste complète sur PMU.' >&2
            exit 2
          fi
          python -m pmu_geny.participation_pmu --manifest "$MANIFEST" \
            --dossier cache_pmu/participations --url-pmu "$PMU_URL" \
            --non-partants "$NP_NUMEROS" --liste-complete --confirme
      - name: Consolider hors ligne les CSV de suivi et les performances
        if: inputs.mode == 'collecter' || inputs.mode == 'controle_np' || inputs.mode == 'consolider'
        shell: bash
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          MANIFEST="cache_pmu/manifestes/GENY-${CID}.json"
          if [ ! -s "$MANIFEST" ]; then echo 'Manifeste absent.' >&2; exit 2; fi
          python -m pmu_geny.export_v17 --manifest "$MANIFEST" --cache cache_pmu --sortie cache_pmu/exports
          mkdir -p "resultats/GENY-${CID}"
          cp -a "cache_pmu/exports/GENY-${CID}/." "resultats/GENY-${CID}/"
      - name: Publier les diagnostics et les bilans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmu-v20-2-${{ github.run_id }}
          path: |
            resultats/
            cache_pmu/manifestes/
            cache_pmu/exports/
            cache_pmu/participations/
            cache_pmu/etat_persistant.json
            cache_pmu/orchestration/
            cache_pmu/pronostics/
            cache_pmu/arrivees/
            cache_pmu/evaluations/
            cache_pmu/ml/
            cache_pmu/cotes/
            cache_pmu/contextes/
          retention-days: 30
          if-no-files-found: warn
      - name: Conserver les historiques et les manifestes sur la branche pmu-data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d cache_pmu ] || [ -z "$(find cache_pmu -type f -print -quit)" ]; then
            echo 'Aucune donnee a sauvegarder.'
            exit 0
          fi
          mkdir -p /tmp/pmu-data-worktree
          if git show-ref --verify --quiet refs/remotes/origin/pmu-data; then
            git worktree add --detach /tmp/pmu-data-worktree origin/pmu-data
            git -C /tmp/pmu-data-worktree switch -C pmu-data origin/pmu-data
          else
            git worktree add -b pmu-data /tmp/pmu-data-worktree HEAD
            git -C /tmp/pmu-data-worktree rm -rf --ignore-unmatch . >/dev/null
            git -C /tmp/pmu-data-worktree clean -fdx >/dev/null
          fi
          cp -a cache_pmu/. /tmp/pmu-data-worktree/
          git -C /tmp/pmu-data-worktree config user.name 'github-actions[bot]'
          git -C /tmp/pmu-data-worktree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/pmu-data-worktree add -A
          if git -C /tmp/pmu-data-worktree diff --cached --quiet; then
            echo 'Aucune nouvelle donnee a committer.'
          else
            git -C /tmp/pmu-data-worktree commit -m "PMU data: run ${{ github.run_id }}"
            git -C /tmp/pmu-data-worktree push origin HEAD:refs/heads/pmu-data
            echo 'DONNEES SAUVEGARDEES : branche pmu-data'
          fi
