name: PMU - V21 - Rapprochement PMU Geny et tableau de bord

on:
  # Declenchement de production controle par commit du marqueur uniquement.
  push:
    branches: [main]
    paths:
      - 'pilotage/declencher-production-v21.txt'
  schedule:
    # Tick léger ; cycle horaire ou rafraîchissement ciblé H-2/H-1 selon le plan.
    - cron: '7,22,37,52 * * * *'  # évite les pointes aux quarts d’heure, sans multiplier les cycles
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cycle global, collecte, consolidation ou apprentissage ML'
        type: choice
        required: true
        default: 'auto'
        options: ['auto', 'decouvrir', 'collecter', 'controle_np', 'consolider', 'entrainer_ml', 'experience_ml']
      ml_validation:
        description: 'Jour de validation de experience_ml (AAAA-MM-JJ)'
        type: string
        default: ''
      ml_test:
        description: 'Jour de test separe de experience_ml (AAAA-MM-JJ)'
        type: string
        default: ''
      course_url:
        description: 'URL officielle Geny /course/ID.../partants-pronostics'
        type: string
        required: true
        default: 'https://www.geny.com/course/1697377-2026-11-10-vincennes-prix-de-beauvais/partants-pronostics'
      nombre_partants:
        description: 'Nombre de lignes attendues (declarations, non-partants inclus)'
        type: number
        required: true
        default: 18
      pmu_url:
        description: 'URL de la fiche officielle PMU consultee (mode controle_np)'
        type: string
        required: false
        default: ''
      np_numeros:
        description: 'Numeros NP releves sur PMU, separes par virgules; vide si 0 NP'
        type: string
        required: false
        default: ''
      pmu_liste_complete:
        description: 'Confirmer que la liste complete sur PMU a ete examinee'
        type: boolean
        required: false
        default: false
      max_chevaux:
        description: 'Maximum de nouvelles fiches a consulter pour cette execution'
        type: number
        required: true
        default: 18

permissions:
  contents: write
  actions: write

concurrency:
  group: pmu-donnees-production
  cancel-in-progress: false
  queue: max

jobs:
  traiter-course:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Valider les parametres et restaurer les donnees durables
        env:
          COURSE_URL: ${{ inputs.course_url || 'https://www.geny.com/course/1697377-2026-11-10-vincennes-prix-de-beauvais/partants-pronostics' }}
          NOMBRE: ${{ inputs.nombre_partants || 18 }}
          MAX: ${{ inputs.max_chevaux || 18 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache_pmu resultats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PYVALID'
          import os, re
          from urllib.parse import urlparse
          url=os.environ['COURSE_URL']
          parsed=urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname in ('www.geny.com','geny.com'), 'URL externe non autorisee'
          m=re.match(r'^/course/(\d+)(?:-[^/]*)?(?:/partants-pronostics)?/?$',parsed.path)
          assert m, 'URL de course Geny invalide'
          assert 1 <= int(os.environ['NOMBRE']) <= 30
          assert 1 <= int(os.environ['MAX']) <= 30
          with open('course_id.txt','w') as f:f.write(m.group(1))
          print('COURSE ID',m.group(1))
          PYVALID
          if git ls-remote --exit-code --heads origin pmu-data >/dev/null 2>&1; then
            git fetch --no-tags origin pmu-data
            git archive origin/pmu-data | tar -x -C cache_pmu
            echo 'DONNEES PERSISTANTES : rechargees depuis pmu-data'
          else
            echo 'DONNEES PERSISTANTES : branche pmu-data absente, initialisation'
          fi
      - name: Planifier le cycle horaire et les echeances H-2 H-1
        id: plan
        env:
          FORCER_AUTO: ${{ github.event_name != 'schedule' }}
          MODE_PRODUCTION: ${{ inputs.mode || 'auto' }}
        run: python -m pmu_geny.echeances_production --cache cache_pmu
      - name: Auditer le checkpoint du rattrapage historique
        if: steps.plan.outputs.executer == 'true'
        shell: bash
        run: |
          rapport=resultats/audit_checkpoint_rattrapage.json
          if python -m pmu_geny.audit_checkpoint cache_pmu/rattrapage_historiques/bilan.json --seuil-heures 6 > "$rapport"; then
            cat "$rapport"
          else
            code=$?
            if [ "$code" -eq 1 ]; then
              cat "$rapport"
              echo "::warning::Le checkpoint de rattrapage contient des alertes. Voir le rapport d'audit."
            else
              rm -f "$rapport"
              echo "::warning::L'audit du checkpoint de rattrapage n'a pas produit de rapport (code $code)."
            fi
          fi
      - name: Restaurer le cache du navigateur Playwright
        if: steps.plan.outputs.executer == 'true' && (inputs.mode == 'decouvrir' || inputs.mode == 'collecter')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Installer dependances Python et navigateur optionnel
        if: steps.plan.outputs.executer == 'true'
        env:
          MODE_PRODUCTION: ${{ inputs.mode || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          # Le test de production PMU ne doit jamais attendre un navigateur Geny.
          # Les cycles normaux tentent Chromium pendant 45 secondes au maximum.
          if [ "$MODE_PRODUCTION" != "decouvrir" ] && [ "$MODE_PRODUCTION" != "collecter" ]; then
            echo 'MODE_PMU_PRIORITAIRE : navigateur Geny facultatif; synchronisation Sheets prioritaire'
          else
            timeout 45s python -m playwright install chromium || echo 'GENY_CHROMIUM_NON_DISPONIBLE : PMU et Google Sheets continuent'
          fi
      - name: Installer les dependances ML (cycles legers inclus)
        if: steps.plan.outputs.executer == 'true'
        run: python -m pip install -q -r requirements-ml.txt
      - name: Cycle automatique quotidien (PMU puis Geny, sans doublons)
        if: steps.plan.outputs.executer == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'auto')
        shell: bash
        env:
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          python - <<'PYRUN'
          from datetime import datetime, timedelta, timezone
          from pmu_geny.auto_v18 import run
          from pmu_geny.echeances_production import lire, sauver, planifier, PARIS
          from pmu_geny.rapprochement_reunions import rapprocher
          from pathlib import Path

          root = Path('cache_pmu')
          clock = lambda: datetime.now(timezone.utc)
          now = clock()
          plan_path = Path('resultats/plan_production.json')
          plan = lire(plan_path)
          mode = plan['mode']
          if mode == 'RAPPROCHEMENT':
              rapprocher(root, plan, clock)
          else:
              today = now.astimezone(PARIS).date()
              def refresh_plan():
                  fresh = planifier(root, clock())
                  if fresh['mode'] == 'JALONS':
                      fresh['plan_utc'] = plan['plan_utc']
                      sauver(plan_path, fresh)
                      return fresh['selection']
                  return []
              run(root, today.isoformat(), plan['selection'], 0,
                  max_discoveries=0, now=now, selection_complete=True, clock=clock,
                  priorites=plan['selection'], production=True,
                  prioritaire=mode == 'JALONS', actualiser_plan=refresh_plan if mode == 'GLOBAL' else None)
              if lire(plan_path)['mode'] == 'GLOBAL':
                  tomorrow = (today + timedelta(days=1)).isoformat()
                  run(root, tomorrow, [], 0, max_discoveries=0, now=now,
                      selection_complete=True, clock=clock, production=True)
          PYRUN
      - name: Identifier le périmètre après actualisation du programme
        if: steps.plan.outputs.executer == 'true'
        id: perimetre
        run: |
          python - <<'PYMODE'
          import json, os
          from pathlib import Path
          mode = json.loads(Path('resultats/plan_production.json').read_text())['mode']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('mode=' + mode, file=output)
          PYMODE
      - name: Experience ML manuelle avec jour de test exclu
        if: steps.plan.outputs.executer == 'true' && (inputs.mode == 'experience_ml')
        env:
          ML_VALIDATION: ${{ inputs.ml_validation }}
          ML_TEST: ${{ inputs.ml_test }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python - <<'PYEXPERIENCE'
          import os
          from datetime import date
          from pathlib import Path
          from pmu_geny.experience_ml import run
          validation=date.fromisoformat(os.environ['ML_VALIDATION']).isoformat()
          test=date.fromisoformat(os.environ['ML_TEST']).isoformat()
          cache=Path('cache_pmu')
          report=run(cache,cache/'ml/experiences'/('manuel-'+os.environ['GITHUB_RUN_ID']),validation,test)
          print(report['statut'],report['modele_choisi_avant_test'],report['test_ml']['moyenne'])
          PYEXPERIENCE
      - name: Decouvrir les partants, sans collecter les historiques
        if: steps.plan.outputs.executer == 'true' && (inputs.mode == 'decouvrir')
        env:
          COURSE_URL: ${{ inputs.course_url || 'https://www.geny.com/course/1697377-2026-11-10-vincennes-prix-de-beauvais/partants-pronostics' }}
          NOMBRE: ${{ inputs.nombre_partants || 18 }}
        shell: bash
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          # Un manifeste valide est reutilise : zero requete reseau.
          if [ -s "cache_pmu/manifestes/GENY-${CID}.json" ]; then
            echo "MANIFESTE EXISTANT : pas de nouvelle decouverte pour ${CID}"
          else
            # Ne pas redemander une page des partants pendant le cooldown partage.
            python - <<'PYCOOLDOWN'
          from datetime import datetime, timezone
          from pmu_geny.echeances_production import pause_geny_active
          if pause_geny_active('cache_pmu', datetime.now(timezone.utc)):
              raise SystemExit('COOLDOWN GENY : decouverte differee sans nouvelle requete.')
          PYCOOLDOWN
            python -m pmu_geny.decouverte_partants \
              --course-url "$COURSE_URL" \
              --attendu "$NOMBRE" \
              --manifest "cache_pmu/manifestes/GENY-${CID}.json" \
              --diagnostic "resultats/decouverte-${CID}" \
              --etat cache_pmu/etat_persistant.json
          fi
      - name: Collecter depuis la file incrementale persistante
        if: steps.plan.outputs.executer == 'true' && (inputs.mode == 'collecter')
        env:
          MAX: ${{ inputs.max_chevaux || 18 }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
        shell: bash
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          MANIFEST="cache_pmu/manifestes/GENY-${CID}.json"
          if [ ! -s "$MANIFEST" ]; then
            echo "ERREUR : aucun manifeste pour GENY-${CID}. Lancer d'abord le mode decouvrir." >&2
            exit 2
          fi
          # Même chemin que le worker permanent, aucune ancienne collecte par lots.
          python -m pip install -q google-auth==2.43.0 requests
          python -m pmu_geny.historiques_incrementaux --cache cache_pmu \
            --max-minutes 15 --max-chevaux "$MAX" --publier
      - name: Verifier les non-partants d'apres une consultation confirmee de PMU
        if: steps.plan.outputs.executer == 'true' && (inputs.mode == 'controle_np')
        shell: bash
        env:
          PMU_URL: ${{ inputs.pmu_url }}
          NP_NUMEROS: ${{ inputs.np_numeros }}
          PMU_LISTE_COMPLETE: ${{ inputs.pmu_liste_complete }}
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          MANIFEST="cache_pmu/manifestes/GENY-${CID}.json"
          if [ ! -s "$MANIFEST" ]; then echo 'Manifeste absent : lancer decouvrir.' >&2; exit 2; fi
          if [ "$PMU_LISTE_COMPLETE" != 'true' ]; then
            echo 'Pour valider 0 NP et tous les partants, confirmer la consultation de la liste complète sur PMU.' >&2
            exit 2
          fi
          python -m pmu_geny.participation_pmu --manifest "$MANIFEST" \
            --dossier cache_pmu/participations --url-pmu "$PMU_URL" \
            --non-partants "$NP_NUMEROS" --liste-complete --confirme
      - name: Consolider hors ligne les CSV de suivi et les performances
        if: steps.plan.outputs.executer == 'true' && (inputs.mode == 'collecter' || inputs.mode == 'controle_np' || inputs.mode == 'consolider')
        shell: bash
        run: |
          set -euo pipefail
          CID="$(cat course_id.txt)"
          MANIFEST="cache_pmu/manifestes/GENY-${CID}.json"
          if [ ! -s "$MANIFEST" ]; then echo 'Manifeste absent.' >&2; exit 2; fi
          python -m pmu_geny.export_v17 --manifest "$MANIFEST" --cache cache_pmu --sortie cache_pmu/exports
          mkdir -p "resultats/GENY-${CID}"
          cp -a "cache_pmu/exports/GENY-${CID}/." "resultats/GENY-${CID}/"
      - name: Conserver les donnees avant publication
        id: persistance
        if: always() && steps.plan.outputs.executer == 'true'
        run: python -m pmu_geny.persistance_production --cache cache_pmu

      - name: Synchroniser le registre Google Sheets (apres persistance)
        id: publication
        if: always() && steps.plan.outputs.executer == 'true' && steps.persistance.conclusion == 'success'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
          PMU_CACHE: cache_pmu
          PMU_KPI_DIFFERE: 'true'
          PMU_PLAN: resultats/plan_production.json
          PMU_PREUVE_SHEETS: resultats/synchronisation/preuves_top3.json
        run: |
          python -m pip install -q google-auth==2.43.0 requests
          python -m pmu_geny.sync_google_sheets

      - name: Certifier les publications et les echeances reelles
        if: always() && steps.plan.outputs.executer == 'true'
        env:
          PUBLICATION_REUSSIE: ${{ steps.publication.conclusion == 'success' }}
        run: |
          python -m pmu_geny.echeances_production --cache cache_pmu --certifier --strict --preuve-sheets resultats/synchronisation/preuves_top3.json
      - name: Persister immédiatement les versions figées et les preuves
        if: always() && steps.plan.outputs.executer == 'true'
        run: python -m pmu_geny.persistance_production --cache cache_pmu
      - name: Relever les articles 24H au Trot avant les prochaines courses
        if: always() && steps.publication.conclusion == 'success' && (steps.perimetre.outputs.mode == 'GLOBAL' || steps.perimetre.outputs.mode == 'JALONS' || steps.perimetre.outputs.mode == 'RAPPROCHEMENT')
        continue-on-error: true
        run: timeout 45s python -m pmu_geny.avis_24h_trot --cache cache_pmu
      - name: Réparer les ferrures du cache après la publication globale
        if: always() && steps.perimetre.outputs.mode == 'GLOBAL' && steps.publication.conclusion == 'success'
        run: |
          python - <<'PYFERRURES'
          from pathlib import Path
          from pmu_geny.reparer_ferrures import reparer
          print(reparer(Path('cache_pmu'), partants=True))
          PYFERRURES
      - name: Rafraichir les index Geny apres publication PMU
        if: always() && steps.plan.outputs.executer == 'true' && steps.publication.conclusion == 'success' && steps.perimetre.outputs.mode == 'GLOBAL'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Le module refuse les appels pendant le cooldown partage et les cycles JALONS.
          if python -m pmu_geny.index_geny_apres_publication --cache cache_pmu --plan resultats/plan_production.json --verifier; then
            if timeout 45s python -m playwright install chromium; then
              timeout 120s python -m pmu_geny.index_geny_apres_publication --cache cache_pmu --plan resultats/plan_production.json
            fi
          fi
      - name: Apprentissage ML unique apres les cycles de resultats
        if: always() && steps.plan.outputs.executer == 'true' && steps.publication.conclusion == 'success' && (steps.perimetre.outputs.mode == 'GLOBAL' || steps.perimetre.outputs.mode == 'RAPPROCHEMENT' || inputs.mode == 'entrainer_ml')
        env:
          ML_PREPRODUCTION_COURSES: ${{ vars.ML_PREPRODUCTION_COURSES }}
          ML_PREPRODUCTION_OBSERVATIONS: ${{ vars.ML_PREPRODUCTION_OBSERVATIONS }}
          ML_PREPRODUCTION_PROSPECTIVES: ${{ vars.ML_PREPRODUCTION_PROSPECTIVES }}
          ML_PREPRODUCTION_COMPLETUDE: ${{ vars.ML_PREPRODUCTION_COMPLETUDE }}
          ML_PRODUCTION_COURSES: ${{ vars.ML_PRODUCTION_COURSES }}
          ML_PRODUCTION_OBSERVATIONS: ${{ vars.ML_PRODUCTION_OBSERVATIONS }}
          ML_PRODUCTION_PROSPECTIVES: ${{ vars.ML_PRODUCTION_PROSPECTIVES }}
          ML_PRODUCTION_COMPLETUDE: ${{ vars.ML_PRODUCTION_COMPLETUDE }}
          MODE_PRODUCTION: ${{ inputs.mode || 'auto' }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          if [ "$MODE_PRODUCTION" = "entrainer_ml" ]; then
            timeout 90s python -m pmu_geny.cycle_ml --cache cache_pmu --force
          else
            python -m pmu_geny.cycle_ml --cache cache_pmu
          fi
      - name: Conserver les preuves meme si le controle fonctionnel echoue
        id: persistance_finale
        if: always() && steps.plan.outputs.executer == 'true'
        run: python -m pmu_geny.persistance_production --cache cache_pmu
      - name: Consolider les KPI apres certification et persistance
        if: always() && steps.plan.outputs.executer == 'true' && steps.publication.conclusion == 'success' && steps.persistance_finale.conclusion == 'success'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
          PMU_CACHE: cache_pmu
          PMU_KPI_ONLY: 'true'
          PMU_KPI_HISTORY: 'true'
        run: python -m pmu_geny.sync_google_sheets
      - name: Archiver le plan et le controle de production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilotage-production-${{ github.run_id }}
          path: |
            resultats/plan_production.json
            resultats/audit_checkpoint_rattrapage.json
            cache_pmu/qualite/dernier_controle_production.json
            cache_pmu/jalons/
            cache_pmu/rapprochements/
            cache_pmu/publications/
            cache_pmu/ml/maturite.json
            cache_pmu/ml/preuve_promotion.json
          retention-days: 30
      - name: Conserver les controles de synchronisation Sheets
        if: steps.plan.outputs.executer == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: controles-sheets-${{ github.run_id }}-${{ github.run_attempt }}
          path: resultats/synchronisation/
          retention-days: 30
          if-no-files-found: warn


      - name: Audit de completude des TOP3 et donnees courantes
        if: steps.plan.outputs.executer == 'true' && (always())
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resultats/qualite
          python -m pmu_geny.qualite_registre_v21 --cache cache_pmu --debut 2026-11-12 --sortie resultats/qualite/couverture_registre.json
      - name: Publier les diagnostics et les bilans
        if: steps.plan.outputs.executer == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: pmu-v20-2-${{ github.run_id }}
          path: |
            resultats/
            cache_pmu/manifestes/
            cache_pmu/exports/
            cache_pmu/participations/
            cache_pmu/etat_persistant.json
            cache_pmu/orchestration/
            cache_pmu/pronostics/
            cache_pmu/arrivees/
            cache_pmu/evaluations/
            cache_pmu/ml/
            cache_pmu/cotes/
            cache_pmu/contextes/
            cache_pmu/avis_experts/
            cache_pmu/partants_actuels/
          retention-days: 30
          if-no-files-found: warn
      - name: Donner le relais au collecteur nocturne après le checkpoint PMU
        if: always() && github.ref == 'refs/heads/main' && steps.publication.conclusion == 'success' && steps.persistance_finale.conclusion == 'success' && steps.perimetre.outputs.mode == 'GLOBAL'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -m pmu_geny.echeances_production --cache cache_pmu --relais-nocturne; then
            gh workflow run historiques-incrementaux.yml --ref main -f nocturne=true -f max_minutes=7
          fi
