name: Geny - migration historique du registre
on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: Appliquer après sauvegarde
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pmu-donnees-production
  cancel-in-progress: false
  queue: max
jobs:
  migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: pmu-data
          path: reference_pmu
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth==2.43.0 requests cryptography beautifulsoup4==4.14.3
      - name: Inventaire et sauvegarde chiffrée
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python -m scripts.migrer_structure_geny --archive reference_pmu --sauvegarde sauvegarde-geny
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-geny-${{ github.run_id }}
          path: sauvegarde-geny/
          if-no-files-found: error
          retention-days: 30
      - name: Migration et relecture intégrale
        if: inputs.appliquer
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python -m scripts.migrer_structure_geny --archive reference_pmu --sauvegarde sauvegarde-geny --appliquer
