name: "Experiment historique equidia - diagnostic lecture seule"
on:
  push:
    branches:
      - experiment/historique-equidia
    paths:
      - "experiments/historique-source/**"
      - ".github/workflows/experiment-historique-equidia.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diagnostic-historique-equidia
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verifier syntaxe Python
        run: python -m py_compile experiments/historique-source/sonde.py
      - name: Sonder une URL publique
        shell: bash
        run: |
          mkdir -p resultats-diagnostic
          python experiments/historique-source/sonde.py --source equidia --url 'https://www.equidia.fr/' > resultats-diagnostic/equidia.json
          python -m json.tool resultats-diagnostic/equidia.json >/dev/null
      - name: Publier un bilan JSON lisible via API GitHub
        if: always()
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          source="equidia"
          p=pathlib.Path("resultats-diagnostic")/f"{source}.json"
          try:
              sonde=json.loads(p.read_text(encoding="utf-8"))
          except (OSError,ValueError):
              sonde={"statut":"NON_EXECUTEE","erreur":"Sonde absente ou JSON invalide"}
          # Aucun chiffre de collecte n'est infere d'un diagnostic HTTP.
          bilan={"schema_version":1,"source":source,"test_type":"HTTP_ONLY",
              "date_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run_id":os.environ["GH_RUN_ID"],"run_attempt":os.environ["GH_RUN_ATTEMPT"],
              "run_url":f"https://github.com/{os.environ['GH_REPOSITORY']}/actions/runs/{os.environ['GH_RUN_ID']}",
              "branche":os.environ["GH_REF_NAME"],"commit_teste":os.environ["GH_SHA"],
              "job_status":os.environ["GH_JOB_STATUS"],"sonde":sonde,
              "extraction_historique_validee":False,"chevaux_extraits":None,
              "performances_extraites":None,"taux_completude":None}
          dest=pathlib.Path("suivi-historique")/f"{source}-dernier-test.json"
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(bilan,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "suivi-historique/equidia-dernier-test.json"
          if ! git diff --cached --quiet; then
            git commit -m "ci: publier diagnostic equidia (HTTP uniquement) [skip ci]"
            git push origin "HEAD:refs/heads/experiment/historique-equidia"
          fi
      - name: Conserver les preuves comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-historique-equidia-${{ github.run_id }}
          path: |
            resultats-diagnostic/
            suivi-historique/
          if-no-files-found: warn
          retention-days: 14
