name: PMU - V11 Course 14 chevaux (manuel)

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: 'URL Geny du tableau des partants (vide = pilote Vincennes 10/11/2026)'
        required: false
        type: string
      max_chevaux:
        description: 'Nombre maximal de nouveaux historiques par lancement'
        required: true
        default: '14'
        type: choice
        options: ['3', '14']

permissions:
  contents: read

concurrency:
  group: pmu-v11-course-pilote
  cancel-in-progress: false

jobs:
  test-course:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer l'etat et les historiques disponibles
        uses: actions/cache/restore@v4
        with:
          path: cache_pmu/
          key: pmu-v11-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pmu-v11-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dependances Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Retrouver les partants (ou reutiliser le manifeste pilote)
        env:
          COURSE_URL: ${{ inputs.course_url }}
        shell: bash
        run: |
          mkdir -p resultats cache_pmu
          if [[ -z "$COURSE_URL" && -s cache_pmu/manifest_pilote_1697378.json ]]; then
            cp cache_pmu/manifest_pilote_1697378.json resultats/partants_decouverts.json
            echo 'Liste des 14 partants recuperee depuis le cache pilote.'
          else
            python -m pmu_geny.decouverte_partants --course-url "$COURSE_URL" --attendu 14 --manifest resultats/partants_decouverts.json
            if [[ -z "$COURSE_URL" ]]; then
              cp resultats/partants_decouverts.json cache_pmu/manifest_pilote_1697378.json
            fi
          fi
      - name: Collecter les historiques des 14 chevaux, sequentiellement
        run: |
          python -m pmu_geny.traitement_course \
            --manifest resultats/partants_decouverts.json \
            --sortie resultats \
            --etat cache_pmu/etat_persistant.json \
            --max-chevaux '${{ inputs.max_chevaux }}'
      - name: Enregistrer etat et historiques dans le cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_pmu/
          key: pmu-v11-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publier les fichiers et le bilan meme en cas de 429
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-pmu-v11-14-chevaux
          path: |
            resultats/
            cache_pmu/etat_persistant.json
            cache_pmu/historiques/
          retention-days: 14
          if-no-files-found: warn
