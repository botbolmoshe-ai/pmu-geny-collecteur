name: PMU - Test course à venir (manuel)

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: 'URL Partants/Pronos Geny (vide = recherche Vincennes R2C1 du 10/11/2026)'
        required: false
        type: string
      max_chevaux:
        description: 'Limite de collecte après vérification de tous les partants'
        required: true
        default: '3'
        type: choice
        options: ['3', '14']

permissions:
  contents: read

concurrency:
  group: geny-course-pilote
  cancel-in-progress: false

jobs:
  course-a-venir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer Python et Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Découvrir les partants sur la page Partants Pronos
        env:
          COURSE_URL: ${{ inputs.course_url }}
        run: python -m pmu_geny.decouverte_partants --course-url "$COURSE_URL" --attendu 14 --manifest resultats/partants_decouverts.json
      - name: Extraire les historiques séquentiellement
        run: python -m pmu_geny.traitement_course --manifest resultats/partants_decouverts.json --sortie resultats --max-chevaux "${{ inputs.max_chevaux }}"
      - name: Conserver les diagnostics même si erreur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-course-a-venir
          path: resultats/
          if-no-files-found: warn
          retention-days: 7
