name: PMU - V9 Verification carriere Oscar (manuel)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geny-v9-test-oscar
  cancel-in-progress: false

jobs:
  verification-oscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer dependances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verifier la carriere Oscar (une seule fiche)
        run: python -m pmu_geny.test_acces_carriere --sortie resultats/test_v9
      - name: Publier rapport V9
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-acces-oscar-v9
          path: resultats/test_v9/
          if-no-files-found: warn
          retention-days: 14
