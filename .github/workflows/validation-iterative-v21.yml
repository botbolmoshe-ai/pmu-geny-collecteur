name: PMU V21 - Validation iterative du moteur (lecture seule)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'pmu_geny/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      historiques_registre:
        description: 'Contrôle des historiques courants (publication sur main uniquement)'
        type: choice
        options: [aucun, audit, appliquer]
        default: aucun
      dates_registre:
        description: 'Audit ou migration des dates du registre'
        type: choice
        options: [aucun, audit, appliquer, streamlit]
        default: aucun
      reference:
        description: Exécution contenant la sauvegarde initiale à relire
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: pmu-data
          path: reference_pmu
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -q -r requirements-ml.txt google-auth==2.43.0 requests pyyaml
      - name: Syntaxe
        run: python -m compileall -q pmu_geny scripts tests
      - name: Regression complete (lecture seule)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resultats/validation
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee resultats/validation/regression.log
      - name: Recette d’ordonnancement 48 h hors réseau
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resultats/validation
          python -m unittest discover -s tests -p 'test_recette_48h_offline.py' -v 2>&1 | tee resultats/validation/ordonnancement-48h.log
      - name: Audit du registre et des paliers
        shell: bash
        run: |
          set -euo pipefail
          python -m pmu_geny.recette_finale_v21 --source reference_pmu --registre-evolutif --rapport resultats/validation/registre.json
          python -m unittest discover -s tests -p 'test_v21_paliers_offline.py' -v 2>&1 | tee resultats/validation/paliers.log
      - name: Mesurer la completude reelle des courses du registre
        shell: bash
        run: |
          set -euo pipefail
          python -m pmu_geny.qualite_registre_v21 --cache reference_pmu --debut 2026-11-11 --sortie resultats/validation/qualite_avant_reset.json
          python -m pmu_geny.qualite_registre_v21 --cache reference_pmu --debut 2026-11-12 --sortie resultats/validation/qualite_nouveau_registre.json
      - name: Archiver les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-iterative-v21-${{ github.run_id }}
          path: resultats/validation
          if-no-files-found: warn

  dates-registre:
    if: github.event_name == 'workflow_dispatch' && inputs.dates_registre != 'aucun'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pmu-donnees-production
      cancel-in-progress: false
      queue: max
    env:
      GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth==2.43.0 requests
      - name: Audit de tous les onglets
        if: inputs.dates_registre == 'audit'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p resultats/dates
          python -m pmu_geny.audit_dates_sheets resultats/dates/audit.json
          python -m pmu_geny.migration_dates_sheets --sauvegarde resultats/dates/avant.json.gz
      - name: Sauvegarder avant la migration
        if: inputs.dates_registre == 'appliquer' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p resultats/dates
          python -m pmu_geny.migration_dates_sheets --sauvegarde resultats/dates/avant.json.gz
          python -c 'import hashlib,json,os; print(hashlib.sha256(json.loads(os.environ["GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON"])["private_key"].encode()).hexdigest())' |
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass stdin \
              -in resultats/dates/avant.json.gz -out resultats/dates/avant.json.gz.enc
      - uses: actions/upload-artifact@v4
        if: inputs.dates_registre == 'appliquer' && github.ref == 'refs/heads/main'
        with:
          name: sauvegarde-registre-dates-${{ github.run_id }}
          path: resultats/dates/avant.json.gz.enc
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@v4
        if: inputs.dates_registre == 'appliquer' && github.ref == 'refs/heads/main' && inputs.reference != ''
        with:
          name: sauvegarde-registre-dates-${{ inputs.reference }}
          path: resultats/dates/reference
          run-id: ${{ inputs.reference }}
          github-token: ${{ github.token }}
      - name: Migrer et relire le registre
        if: inputs.dates_registre == 'appliquer' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: |
          args=()
          if [[ -f resultats/dates/reference/avant.json.gz.enc ]]; then
            python -c 'import hashlib,json,os; print(hashlib.sha256(json.loads(os.environ["GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON"])["private_key"].encode()).hexdigest())' |
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass stdin \
                -in resultats/dates/reference/avant.json.gz.enc -out resultats/dates/reference.json.gz
            args+=(--reference resultats/dates/reference.json.gz)
          fi
          python -m pmu_geny.migration_dates_sheets --appliquer --sauvegarde resultats/dates/avant.json.gz "${args[@]}"
      - name: Vérifier Streamlit sur le registre réel
        if: (inputs.dates_registre == 'streamlit' || inputs.dates_registre == 'appliquer') && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install -r dashboard/requirements.txt
          python -m scripts.valider_streamlit_registre
      - uses: actions/upload-artifact@v4
        if: always() && inputs.dates_registre == 'audit'
        with:
          name: dates-registre-${{ github.run_id }}
          path: resultats/dates/audit.json
          if-no-files-found: warn

  historiques-registre:
    if: github.event_name == 'workflow_dispatch' && inputs.historiques_registre != 'aucun'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pmu-donnees-production
      cancel-in-progress: false
      queue: max
    env:
      GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: pmu-data
          path: reference_pmu
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-ml.txt google-auth==2.43.0 requests
      - name: Contrôler les historiques
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.historiques_registre }}
        run: |
          set -euo pipefail
          arguments=()
          if [[ "$MODE" == "appliquer" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            arguments+=(--appliquer)
          fi
          git -C reference_pmu rev-parse HEAD
          python -m pmu_geny.audit_reconciliation_historiques --cache reference_pmu \
            --sortie resultats/historiques/diagnostic.json "${arguments[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-historiques-${{ github.run_id }}
          path: resultats/historiques/diagnostic.json
          if-no-files-found: ignore
