name: PMU - Test progressif historiques Geny (2 chevaux)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Charger uniquement le code de test
        uses: actions/checkout@v4
        with:
          ref: test/rapprochement-2026-11-12
          persist-credentials: false
      - name: Recuperer les liens observes lors du premier test
        uses: actions/download-artifact@v4
        with:
          name: pmu-test-historique-43001015559
          run-id: 43001015559
          repository: botbolmoshe-ai/pmu-geny-collecteur
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: precedent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer navigateur et dependances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collecter deux historiques maximum sans refaire la decouverte
        run: python -m pmu_geny.test_historique_progressif --diagnostic-source precedent/diagnostic_decouverte --pause-secondes 30
      - name: Sauvegarder rapport et historiques du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmu-historiques-progressifs-${{ github.run_id }}
          path: resultats/test_progressif/
          if-no-files-found: warn
