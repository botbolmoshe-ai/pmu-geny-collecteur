name: Historiques courus - un cheval puis sauvegarde et Sheets
on:
  push:
    branches: [test/boucle-historiques-courus]
    paths:
      - '.github/workflows/boucle-historiques-courus.yml'
      - 'scripts/boucle_historiques.py'
      - 'scripts/collecter_un_cheval.py'
      - 'scripts/synchroniser_un_historique.py'
      - 'collecte_unitaire/etat_initial.json'
permissions:
  contents: write
# Evite un ecrasement des nouvelles donnees par le cycle de production.
concurrency:
  group: pmu-donnees-production
  cancel-in-progress: false
jobs:
  boucle:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/boucle-historiques-courus
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Installer le collecteur et la synchronisation
        run: |
          python -m pip install -q -r requirements.txt google-auth==2.43.0 requests
          python -m playwright install chromium
      - name: Restaurer le stockage durable
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin pmu-data
          mkdir -p cache_pmu resultats/boucle
          git archive origin/pmu-data | tar -x -C cache_pmu
      - name: Un cheval, sortie du processus, sauvegarde, Sheets, suivant
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/boucle_historiques.py --max-minutes 210
      - name: Archiver le bilan et les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boucle-historiques-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            collecte_unitaire/
            resultats/boucle/
          retention-days: 14
