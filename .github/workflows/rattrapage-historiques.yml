name: 03 — Geny Rattrapage global
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Budget de collecte du passage (1 a 15 minutes)'
        type: number
        default: 2
        required: true
      actualiser_inventaire:
        description: 'Inclure explicitement les chevaux rencontrés depuis le début du lot'
        type: boolean
        default: false
        required: false
      archives_diagnostics:
        description: 'Artefacts GitHub de diagnostics à revalider, IDs séparés par virgules'
        type: string
        default: ''
        required: false
      reconcilier_identites:
        description: 'Reparer les doublons inter-sources prouves avec sauvegarde distante prealable'
        type: boolean
        default: false
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: pmu-geny-acquisition
  cancel-in-progress: false
  queue: max
env:
  TZ: Europe/Paris
  PMU_REFERENTIEL: 'true'

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pmu-donnees-production
      cancel-in-progress: false
      queue: max
    steps:
      - name: Valider le budget avant de charger la collecte
        env:
          MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          case "$MAX_MINUTES" in
            [1-9]|1[0-5]) ;;
            *)
              echo '::error::Budget du rattrapage hors plage. Saisir un entier de 1 à 15 minutes.'
              exit 2
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restaurer les donnees et verifier si le lot reste actif
        id: etat
        env:
          ACTUALISER_INVENTAIRE: ${{ inputs.actualiser_inventaire || false }}
          RECONCILIER_IDENTITES: ${{ inputs.reconcilier_identites || false }}
          ARCHIVES_DIAGNOSTICS: ${{ inputs.archives_diagnostics || '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p resultats/rattrapage
          python -m pmu_geny.persistance_production --restaurer
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('cache_pmu/rattrapage_historiques/etat.json')
          state=json.loads(path.read_text()) if path.exists() else {}
          done=(state.get('statut')=='TERMINE' and 'historiques_ferrures_a_completer' in state.get('bilan',{})
                and os.environ.get('ACTUALISER_INVENTAIRE')!='true'
                and not os.environ.get('ARCHIVES_DIAGNOSTICS'))
          if os.environ.get('RECONCILIER_IDENTITES')=='true':done=False
          if done:
              assert state['sync_kpi']=='OK'
              assert state['bilan']['cibles_completees']==len(state['chevaux'])
              print('RATTRAPAGE_DEJA_TERMINE',json.dumps(state['bilan']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('actif='+('false' if done else 'true')+'\n')
          PY
      - uses: actions/cache@v4
        if: steps.etat.outputs.actif == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Installer les dependances
        if: steps.etat.outputs.actif == 'true'
        run: |
          python -m pip install -q -r requirements.txt google-auth==2.43.0 requests
          python -m playwright install chromium
      - name: Inventorier tout le stock puis reprendre les historiques
        if: steps.etat.outputs.actif == 'true'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
          MAX_MINUTES: ${{ inputs.max_minutes || 2 }}
          ARCHIVES_DIAGNOSTICS: ${{ inputs.archives_diagnostics || '' }}
          ACTUALISER_INVENTAIRE: ${{ inputs.actualiser_inventaire || false }}
          RECONCILIER_IDENTITES: ${{ inputs.reconcilier_identites || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--dedie)
          case "$(TZ=Europe/Paris date +%H)" in
            2[1-3]|0[0-6]) args+=(--nocturne);;
          esac
          printf 'RATTRAPAGE_DEDIE budget_minutes=%s options=%s\n' "$MAX_MINUTES" "${args[*]}"
          if [ "$ACTUALISER_INVENTAIRE" = 'true' ]; then args+=(--actualiser-inventaire); fi
          if [ -n "$ARCHIVES_DIAGNOSTICS" ]; then args+=(--archives-diagnostics "$ARCHIVES_DIAGNOSTICS"); fi
          if [ "$RECONCILIER_IDENTITES" = 'true' ]; then args+=(--reconcilier-identites); fi
          python -m pmu_geny.rattrapage_historiques --cache cache_pmu --max-minutes "$MAX_MINUTES" --publier "${args[@]}"
      - name: Archiver le bilan et les controles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rattrapage-historiques-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resultats/incremental/
            resultats/rattrapage/
            resultats/synchronisation/
            cache_pmu/rattrapage_historiques/
          retention-days: 30
