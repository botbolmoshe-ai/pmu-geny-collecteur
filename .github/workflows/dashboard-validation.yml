name: 05 — Validation TROT Analytics
on:
  push:
    branches: [main]
    paths: ['dashboard/**', 'pmu_geny/sync_google_sheets.py', 'pmu_geny/kpi_registre.py', '.github/workflows/dashboard-validation.yml', '.streamlit/config.toml', '.devcontainer/devcontainer.json']
  pull_request:
    paths: ['dashboard/**', 'pmu_geny/sync_google_sheets.py', 'pmu_geny/kpi_registre.py', '.github/workflows/dashboard-validation.yml', '.streamlit/config.toml', '.devcontainer/devcontainer.json']
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: Europe/Paris

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q dashboard
      - run: pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s dashboard -p 'test_*.py' -v
      - run: python -c "import streamlit,pandas,plotly,googleapiclient"
