name: PMU - V13 Diagnostic Ocean Dairpet (manuel)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-ocean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tester le parseur hors ligne
        run: python -m pmu_geny.test_parser_v13
      - name: Diagnostiquer Ocean Dairpet sans cache ni recherche des partants
        run: |
          python -m pmu_geny.collecte_geny_v4 \
            --url https://www.geny.com/cheval/2904325-ocean-dairpet/course/1697378 \
            --sortie resultats/test_ocean_v13/2904325 --headless
      - name: Publier les diagnostics meme en cas de resultat partiel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-ocean-v13
          path: resultats/test_ocean_v13/
          retention-days: 14
          if-no-files-found: warn
