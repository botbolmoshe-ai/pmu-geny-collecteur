name: PMU - Historiques incrementaux par cheval
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Duree bornee du passage (1 a 20 minutes)'
        type: number
        default: 15
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: pmu-donnees-production
  cancel-in-progress: false
jobs:
  historiques:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Installer les dependances
        run: |
          python -m pip install -q -r requirements.txt google-auth==2.43.0 requests
          python -m playwright install chromium
      - name: Restaurer les donnees durables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin pmu-data
          mkdir -p cache_pmu resultats/incremental
          git archive origin/pmu-data | tar -x -C cache_pmu
      - name: Collecter, sauvegarder et synchroniser un cheval puis le suivant
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
          MAX_MINUTES: ${{ inputs.max_minutes || 15 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          assert 1 <= int(os.environ['MAX_MINUTES']) <= 20
          PY
          python -m pmu_geny.historiques_incrementaux --cache cache_pmu --max-minutes "$MAX_MINUTES" --publier
      - name: Archiver les diagnostics et le suivi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historiques-incrementaux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resultats/incremental/
            resultats/synchronisation/
            cache_pmu/collecte_incrementale/etat.json
          retention-days: 14
