name: PMU - Historiques incrementaux par cheval
on:
  schedule:
    - cron: '12 0-4 * * *'
      timezone: Europe/Paris
    - cron: '5,20,35,50 5-23 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Duree bornee du passage (1 a 20 minutes)'
        type: number
        default: 7
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: pmu-donnees-production
  cancel-in-progress: false
  queue: max
env:
  PART_FERRURES: ${{ vars.RATTRAPAGE_PART_FERRURES || '25' }}
  COLLECTE_NOCTURNE: ${{ github.event_name == 'schedule' && github.event.schedule == '12 0-4 * * *' }}
jobs:
  historiques:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restaurer les donnees durables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin pmu-data
          mkdir -p cache_pmu resultats/incremental
          git archive origin/pmu-data | tar -x -C cache_pmu
      - name: Reserver les echeances et respecter la pause avant de charger le navigateur
        id: plan
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" = 'schedule' ] && [ "$COLLECTE_NOCTURNE" != 'true' ]; then
            case "$(TZ=Europe/Paris date +%H)" in
              0[0-4])
                echo 'executer=false' >> "$GITHUB_OUTPUT"
                echo 'COLLECTE_DIURNE_DIFFEREE CRENEAU_NOCTURNE'
                exit 0
                ;;
            esac
          fi
          mode=--collecte
          if [ "$COLLECTE_NOCTURNE" = 'true' ]; then mode=--collecte-nocturne; fi
          python -m pmu_geny.echeances_production --cache cache_pmu "$mode"
      - uses: actions/cache@v4
        if: steps.plan.outputs.executer == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Installer les dependances
        if: steps.plan.outputs.executer == 'true'
        run: |
          python -m pip install -q -r requirements.txt google-auth==2.43.0 requests
          python -m playwright install chromium
      - name: Collecter, sauvegarder et synchroniser un cheval puis le suivant
        if: steps.plan.outputs.executer == 'true'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
          MAX_MINUTES: ${{ inputs.max_minutes || 7 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          assert 1 <= int(os.environ['MAX_MINUTES']) <= 20
          PY
          if [ "$COLLECTE_NOCTURNE" = 'true' ]; then
            SECONDS=0
            python -m pmu_geny.historiques_incrementaux --cache cache_pmu --max-minutes "$MAX_MINUTES" --publier --nocturne
            if [ "$SECONDS" -lt 540 ]; then
              python -m pmu_geny.rattrapage_historiques --cache cache_pmu --max-minutes 2 --max-chevaux 1 --part-ferrures "$PART_FERRURES" --publier --nocturne
            else
              echo 'RATTRAPAGE_FOND_DIFFERE BUDGET_CRENEAU_NOCTURNE'
            fi
          else
            python -m pmu_geny.historiques_incrementaux --cache cache_pmu --max-minutes "$MAX_MINUTES" --publier
          fi
      - name: Archiver les diagnostics et le suivi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historiques-incrementaux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resultats/plan_production.json
            resultats/incremental/
            resultats/rattrapage/
            resultats/synchronisation/
            cache_pmu/collecte_incrementale/etat.json
          retention-days: 14
