name: PMU - Historiques incrementaux par cheval
on:
  schedule:
    - cron: '12,42 0-6,21-23 * * *'
      timezone: Europe/Paris
    - cron: '5,20,35,50 7-20 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Duree bornee du passage (1 a 20 minutes)'
        type: number
        default: 7
        required: true
      nocturne:
        description: 'Rejouer un cycle nocturne pendant la plage 21 h–07 h (Paris)'
        type: boolean
        default: false
      acquisition_independante:
        description: 'Découpler l’acquisition de jour et la publication Sheets'
        type: boolean
        default: false
      date_courses:
        description: 'Date PMU (AAAA-MM-JJ) pour examiner tous les chevaux de cet hippodrome'
        type: string
        required: false
      hippodrome:
        description: 'Nom de l’hippodrome pour le passage exhaustif'
        type: string
        required: false
      archive_execution:
        description: 'Identifiant du passage à revalider depuis ses archives, sans accès à Geny'
        type: string
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: pmu-geny-acquisition
  cancel-in-progress: false
  queue: max
jobs:
  historiques:
    permissions:
      contents: write
      actions: write
    if: inputs.date_courses == '' && inputs.hippodrome == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ (inputs.acquisition_independante || (vars.GENY_ACQUISITION_INDEPENDANTE != 'false' && github.event.schedule == '5,20,35,50 7-20 * * *')) && format('geny-lecture-{0}', github.run_id) || 'pmu-donnees-production' }}
      cancel-in-progress: false
      queue: max
    env:
      ACQUISITION_INDEPENDANTE: ${{ inputs.acquisition_independante || (vars.GENY_ACQUISITION_INDEPENDANTE != 'false' && github.event.schedule == '5,20,35,50 7-20 * * *') }}
    outputs:
      publication_independante: ${{ steps.plan.outputs.publication_independante }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restaurer les donnees durables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p resultats/incremental
          python -m pmu_geny.persistance_production --restaurer
      - name: Reserver les echeances et respecter la pause avant de charger le navigateur
        id: plan
        run: |
          if [ "$ACQUISITION_INDEPENDANTE" = 'true' ]; then
            case "$(TZ=Europe/Paris date +%H)" in
              2[1-3]|0[0-6]) echo 'ACQUISITION_DE_JOUR_HORS_CRENEAU'; exit 0 ;;
            esac
            echo 'publication_independante=true' >> "$GITHUB_OUTPUT"
            python -m pmu_geny.echeances_production --cache cache_pmu --collecte-independante
          else
            python -m pmu_geny.echeances_production --cache cache_pmu --collecte-selon-heure
          fi
      - name: Demander un cycle PMU réellement dû
        if: steps.plan.outputs.secours_pmu == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le cycle demandé attend la libération du verrou de production.
          recent=$(date -u -d '3 minutes ago' +%FT%TZ)
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pmu-v16.yml/runs?branch=main&per_page=30" \
            --jq ".workflow_runs[] | select(.status != \"completed\" or (.conclusion == \"success\" and .created_at >= \"$recent\")) | .id")
          if [ -n "$active" ]; then
            echo "SECOURS_PMU_DIFFERE cycle actif ou recent: $active"
            exit 0
          fi
          gh workflow run pmu-v16.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=auto -f secours=true
          echo 'SECOURS_PMU_DEMANDE publication a confirmer'
      - uses: actions/cache@v4
        if: steps.plan.outputs.geny == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Installer les dependances
        if: steps.plan.outputs.executer == 'true'
        run: |
          python -m pip install -q -r requirements.txt
          if [ "$ACQUISITION_INDEPENDANTE" != 'true' ]; then
            python -m pip install -q google-auth==2.43.0 requests
          fi
          if [ "${{ steps.plan.outputs.geny }}" = 'true' ]; then
            python -m playwright install chromium
          fi
      - name: Actualiser les index du programme Geny échus
        if: steps.plan.outputs.geny == 'true'
        run: timeout 60s python -m pmu_geny.index_programmes_geny --cache cache_pmu
      - name: Enrichir les historiques depuis les archives Geny
        if: steps.plan.outputs.geny == 'true'
        run: |
          python -m pmu_geny.reparer_ferrures
          python -m pmu_geny.persistance_production --cache cache_pmu
      - name: Acquérir les carrières et conserver les captures avant Sheets
        if: env.ACQUISITION_INDEPENDANTE == 'true' && steps.plan.outputs.geny == 'true'
        env:
          MAX_MINUTES: ${{ inputs.max_minutes || 7 }}
        run: |
          case "$MAX_MINUTES" in
            [1-9]|1[0-9]|20) ;;
            *) exit 2 ;;
          esac
          python -m pmu_geny.historiques_incrementaux --cache cache_pmu --acquisition-seule --max-minutes "$MAX_MINUTES"
      - name: Collecter, sauvegarder et synchroniser un cheval puis le suivant
        if: env.ACQUISITION_INDEPENDANTE != 'true' && steps.plan.outputs.executer == 'true'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
          MAX_MINUTES: ${{ inputs.max_minutes || 7 }}
          GH_TOKEN: ${{ github.token }}
          GENY_AUTORISE: ${{ steps.plan.outputs.geny }}
          COLLECTE_NOCTURNE: ${{ steps.plan.outputs.nocturne }}
        run: |
          options=()
          if [ "$GENY_AUTORISE" != 'true' ]; then options+=(--local); fi
          python - <<'PY'
          import os
          assert 1 <= int(os.environ['MAX_MINUTES']) <= 20
          PY
          if [ "$COLLECTE_NOCTURNE" = 'true' ]; then
            budget_nocturne() {
              python -c 'from datetime import datetime, timezone; from pmu_geny.echeances_production import budget_collecte_nocturne; print(budget_collecte_nocturne("cache_pmu", datetime.now(timezone.utc)))'
            }
            SECONDS=0
            budget=$(budget_nocturne)
            prioritaire=$(( budget < MAX_MINUTES ? budget : MAX_MINUTES ))
            # Sur un créneau exploitable pour les deux files, garder deux minutes
            # pour le fond et une minute pour le relais. La garde PMU reste prioritaire.
            if [ "$budget" -ge 5 ] && [ "$prioritaire" -gt "$(( budget - 3 ))" ]; then
              prioritaire=$(( budget - 3 ))
            fi
            echo "BUDGET_NOCTURNE initial=${budget}m prioritaire=${prioritaire}m geny=$GENY_AUTORISE"
            if [ "$prioritaire" -gt 0 ]; then
              python -m pmu_geny.historiques_incrementaux --cache cache_pmu --max-minutes "$prioritaire" --publier --nocturne "${options[@]}"
            fi
            budget=$(budget_nocturne)
            restant=$(( 15 - (SECONDS + 59) / 60 ))
            fond=$(( budget < restant ? budget : restant ))
            echo "BUDGET_NOCTURNE apres_prioritaire=${budget}m restant_cycle=${restant}m fond=${fond}m"
            if [ "$fond" -gt 0 ]; then
              python -m pmu_geny.rattrapage_historiques --cache cache_pmu --max-minutes "$fond" --publier --nocturne "${options[@]}"
            else
              echo 'RATTRAPAGE_FOND_DIFFERE BUDGET_CRENEAU_NOCTURNE'
            fi
          else
            python -m pmu_geny.historiques_incrementaux --cache cache_pmu --max-minutes "$MAX_MINUTES" --publier "${options[@]}"
          fi
      - name: Archiver les diagnostics et le suivi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historiques-incrementaux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resultats/plan_production.json
            resultats/incremental/
            resultats/rattrapage/
            resultats/synchronisation/
            cache_pmu/collecte_incrementale/etat.json
            cache_pmu/rattrapage_historiques/bilan.json
          retention-days: 14

  publication:
    needs: historiques
    if: always() && !cancelled() && needs.historiques.outputs.publication_independante == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: pmu-donnees-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relire la file durable et publier les captures en attente
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pmu_geny.persistance_production --restaurer
          python -m pip install -q google-auth==2.43.0 requests beautifulsoup4==4.14.3
          python -m pmu_geny.historiques_incrementaux --cache cache_pmu --publication-seule --max-minutes 3

  recensement:
    if: github.event_name == 'workflow_dispatch' && (inputs.date_courses != '' || inputs.hippodrome != '')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: pmu-donnees-production
      cancel-in-progress: false
      queue: max
    outputs:
      reprise_utc: ${{ steps.collecte.outputs.reprise_utc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restaurer les données et vérifier le périmètre
        env:
          DATE_COURSES: ${{ inputs.date_courses }}
          HIPPODROME: ${{ inputs.hippodrome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pmu_geny.persistance_production --restaurer
          python -m pmu_geny.historiques_incrementaux --date-courses "$DATE_COURSES" --hippodrome "$HIPPODROME"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Installer le collecteur de production
        run: |
          python -m pip install -q -r requirements.txt google-auth==2.43.0 requests
          python -m playwright install chromium
      - name: Charger les captures du passage à revalider
        if: inputs.archive_execution != ''
        uses: actions/download-artifact@v4
        with:
          name: recensement-historiques-${{ inputs.archive_execution }}-1
          run-id: ${{ inputs.archive_execution }}
          github-token: ${{ github.token }}
          path: archives_recensement
      - name: Examiner chaque cheval et sauvegarder les preuves
        id: collecte
        env:
          DATE_COURSES: ${{ inputs.date_courses }}
          HIPPODROME: ${{ inputs.hippodrome }}
          ARCHIVE_EXECUTION: ${{ inputs.archive_execution }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: '1BjzDzC6NsLRMax2XjrCIcCIIgz6hyCJ1YTWOa5hiGLo'
        run: |
          options=()
          if [ -n "$ARCHIVE_EXECUTION" ]; then options+=(--archive-recensement archives_recensement); fi
          python -m pmu_geny.historiques_incrementaux --publier --date-courses "$DATE_COURSES" --hippodrome "$HIPPODROME" "${options[@]}"
      - name: Archiver le bilan et les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recensement-historiques-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache_pmu/collecte_incrementale/recensements/
            resultats/incremental/
          retention-days: 14
  reprendre_recensement:
    needs: recensement
    if: needs.recensement.outputs.reprise_utc != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reprendre le lot hors du verrou de production
        env:
          REPRISE_UTC: ${{ needs.recensement.outputs.reprise_utc }}
          GH_TOKEN: ${{ github.token }}
          DATE_COURSES: ${{ inputs.date_courses }}
          HIPPODROME: ${{ inputs.hippodrome }}
          ARCHIVE_EXECUTION: ${{ inputs.archive_execution }}
        run: |
          reprise=$(date -u -d "$REPRISE_UTC" +%s)
          restant=$(( reprise - $(date -u +%s) + 1 ))
          if [ "$restant" -gt 0 ]; then
            echo "Prochain passage du lot à partir de $REPRISE_UTC"
            sleep "$restant"
          fi
          gh workflow run historiques-incrementaux.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f date_courses="$DATE_COURSES" -f hippodrome="$HIPPODROME" -f archive_execution="$ARCHIVE_EXECUTION"
