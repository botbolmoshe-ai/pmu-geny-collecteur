name: PMU - V15 Vincennes R2C8 Prix de Beauvais (manuel)

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: 'URL Geny R2C8 (par defaut Prix de Beauvais 10/11/2026)'
        required: true
        default: 'https://www.geny.com/course/1697377-2026-11-10-vincennes-prix-de-beauvais/partants-pronostics'
        type: string
      max_chevaux:
        description: 'Nombre maximal de nouveaux historiques par lancement'
        required: true
        default: '18'
        type: choice
        options: ['3', '18']

permissions:
  contents: read

concurrency:
  group: pmu-v15-beauvais-1697377
  cancel-in-progress: false

jobs:
  test-course:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer l'etat et les historiques disponibles
        uses: actions/cache/restore@v4
        with:
          path: cache_pmu/
          key: pmu-v15-beauvais-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pmu-v15-beauvais-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dependances Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Decouvrir exactement 18 chevaux de Vincennes R2C8
        env:
          COURSE_URL: ${{ inputs.course_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resultats cache_pmu
          case "$COURSE_URL" in
            https://www.geny.com/course/1697377-*|https://geny.com/course/1697377-*) ;;
            *) echo 'ERREUR: cette chaine V15 est reservee a Geny R2C8, course 1697377' >&2; exit 1 ;;
          esac
          python -m pmu_geny.decouverte_partants \
            --course-url "$COURSE_URL" \
            --attendu 18 \
            --manifest resultats/partants_decouverts.json \
            --diagnostic resultats/decouverte
          python - <<'PYVALID'
          import json
          from pathlib import Path
          m = json.loads(Path('resultats/partants_decouverts.json').read_text(encoding='utf-8'))
          c = m['courses'][0]
          assert c['course_id'] == 'GENY-1697377', c['course_id']
          assert len(c['partants']) == 18
          # La liste des 18 declares contient possiblement un non-partant n°8.
          # Son statut PMU devra etre verifie a part; ce workflow n'etablit pas le NP officiel.
          print('MANIFESTE R2C8 VALIDE : 18 fiches chevaux', flush=True)
          PYVALID
      - name: Collecter les historiques des 18 chevaux, sequentiellement
        run: |
          python -m pmu_geny.traitement_course \
            --manifest resultats/partants_decouverts.json \
            --sortie resultats \
            --etat cache_pmu/etat_persistant.json \
            --max-chevaux '${{ inputs.max_chevaux }}'
      - name: Enregistrer etat et historiques dans le cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_pmu/
          key: pmu-v15-beauvais-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publier les fichiers et le bilan meme en cas de 429
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-pmu-v15-r2c8-beauvais
          path: |
            resultats/
            cache_pmu/etat_persistant.json
            cache_pmu/historiques/
          retention-days: 14
          if-no-files-found: warn
