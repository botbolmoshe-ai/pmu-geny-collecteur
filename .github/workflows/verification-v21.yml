name: PMU - V21 - Verification de coherence (sans production)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Charger V21
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer dependances Python sans navigateur
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scikit-learn==1.7.2 joblib==1.5.2
      - name: Controler la syntaxe du programme
        run: python -m compileall -q pmu_geny tests
      - name: Executer tous les tests hors ligne
        run: |
          mkdir -p resultats/v21
          python -m unittest discover -s tests -p 'test_*offline.py' -v 2>&1 | tee resultats/v21/tests_offline.log
          test ${PIPESTATUS[0]} -eq 0
          python -m unittest tests/test_v21_coherence_offline.py -v 2>&1 | tee resultats/v21/tests_v21.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Archiver les controles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-v21-${{ github.run_id }}
          path: resultats/v21/
          if-no-files-found: warn
