name: "Experiment historique pmu - diagnostic lecture seule"
on:
  push:
    branches:
      - experiment/historique-pmu
    paths:
      - "experiments/historique-source/**"
      - ".github/workflows/experiment-historique-pmu.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verifier syntaxe Python
        run: python -m py_compile experiments/historique-source/sonde.py
      - name: Sonder une URL publique et produire une preuve JSON
        shell: bash
        run: |
          mkdir -p resultats-diagnostic
          python experiments/historique-source/sonde.py --source pmu --url 'https://www.pmu.fr/' | tee resultats-diagnostic/pmu.json
          python -m json.tool resultats-diagnostic/pmu.json >/dev/null
      - name: Conserver les preuves meme si la sonde echoue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-historique-pmu-${{ github.run_id }}
          path: resultats-diagnostic/
          if-no-files-found: warn
          retention-days: 14
